# nalarhakim-public managed nginx v1
server {
    listen 80;
    listen [::]:80;
    server_name nalarhakim.com www.nalarhakim.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nalarhakim-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://nalarhakim.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nalarhakim.com;
    ssl_certificate /etc/letsencrypt/live/nalarhakim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nalarhakim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://nalarhakim.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nalarhakim.com;
    ssl_certificate /etc/letsencrypt/live/nalarhakim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nalarhakim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/nalarhakim/current;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Revalidate URLs when content changes; hashed asset queries still work.
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
