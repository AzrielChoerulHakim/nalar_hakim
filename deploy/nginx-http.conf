# nalarhakim-public managed nginx v1
# HTTP bootstrap; keep ACME reachable for HTTPS setup and future renewal.
server {
    listen 80;
    listen [::]:80;
    server_name nalarhakim.com www.nalarhakim.com;
    root /var/www/nalarhakim/current;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nalarhakim-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
