name: Theme checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find theme/nalar-hakim -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: node --check theme/nalar-hakim/assets/site.js
      - name: Package theme
        run: python3 scripts/package.py
      - name: Build static preview
        run: python3 scripts/build-preview.py
      - name: Check preview JavaScript
        run: node --check preview/search.js
      - name: Check desktop animation JavaScript
        run: |
          node --check preview/motion.js
          node --check preview/signals.js
          node --check preview/nature-scene.js
          node scripts/check-nature-motion.cjs
          node --check preview/desktop-nature.js
          node --check preview/butterfly.js
          node scripts/check-butterfly.cjs
          node --check preview/scroll-story.js
          node scripts/check-scroll-story.cjs
          node --check preview/idea-flow.js
          node scripts/check-idea-flow.cjs
      - name: Check preview links and reading anchors
        run: python3 scripts/check-preview.py
      - name: Check domain export and release activation
        run: python3 scripts/test-static-release.py
      - name: Verify generated preview is current
        run: git diff --exit-code -- index.html beranda.html cari.html tentang.html kirim-naskah.html kebijakan-redaksi.html 404.html artikel bentuk preview sitemap.xml robots.txt
