name: Theme checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find theme/nalar-hakim -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: node --check theme/nalar-hakim/assets/site.js
      - name: Package theme
        run: python3 scripts/package.py
      - name: Build static preview
        run: python3 scripts/build-preview.py
      - name: Check preview JavaScript
        run: node --check preview/search.js
      - name: Check retired public motion and navigation
        run: python3 scripts/check-reading-cleanup.py
      - name: Check preview links and reading anchors
        run: python3 scripts/check-preview.py
      - name: Check domain export and release activation
        run: python3 scripts/test-static-release.py
      - name: Verify generated preview is current
        run: git diff --exit-code -- index.html beranda.html cari.html tentang.html kirim-naskah.html kebijakan-redaksi.html 404.html artikel bentuk preview sitemap.xml robots.txt
  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Render and test actual committed pages
        run: python3 scripts/check-mobile.py
      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-proof
          path: mobile-proof/
      - name: Compare rebuilt files
        if: always()
        run: |
          mkdir -p mobile-proof
          python3 scripts/build-preview.py
          git diff --stat
          git diff -- index.html beranda.html cari.html tentang.html kirim-naskah.html kebijakan-redaksi.html 404.html artikel bentuk preview sitemap.xml robots.txt > mobile-proof/generated.patch
          cat mobile-proof/generated.patch

